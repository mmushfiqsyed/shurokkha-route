[project]
name = "shurokkha_route"
version = "0.1.0"
description = "shurokkha_route using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.1,<2.0.0",
]

[project.scripts]
kickoff = "shurokkha_route.main:kickoff"
run_crew = "shurokkha_route.main:kickoff"
plot = "shurokkha_route.main:plot"
run_with_trigger = "shurokkha_route.main:run_with_trigger"
crew-server = "shurokkha_route.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
